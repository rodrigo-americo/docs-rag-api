# docker-compose.yml
# Sem campo `version`: o Compose v2 usa o spec atual por default.
# Declarar `version` gera warning e é resquício do Compose v1.

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16-bookworm
    container_name: docs-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Expor no host pra FastAPI rodando fora do compose (modo dev) conectar
      # em localhost:5432. Quando o app for containerizado, ele usa o hostname
      # `postgres` na rede interna e essa exposição vira opcional.
      - "5433:5432"
    volumes:
      # Volume nomeado: sobrevive a `docker compose down`.
      # Pra wipe limpo: `docker compose down -v` (note o -v).
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready vem no PATH da imagem oficial. Checa se o postmaster
      # está aceitando conexão — diferente de só "o container está up".
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    shm_size: 256mb

volumes:
  postgres_data: