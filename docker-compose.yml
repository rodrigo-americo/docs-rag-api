# docker-compose.yml
# Sem campo `version`: o Compose v2 usa o spec atual por default.
# Declarar `version` gera warning e é resquício do Compose v1.

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16-bookworm
    container_name: docs-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Expor no host permite conectar em localhost:5433 com um client externo
      # (psql, DBeaver) ou rodar a API fora do compose. O serviço `api` abaixo
      # não usa esta porta — ele fala com `postgres:5432` na rede interna.
      - "5433:5432"
    volumes:
      # Volume nomeado: sobrevive a `docker compose down`.
      # Pra wipe limpo: `docker compose down -v` (note o -v).
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready vem no PATH da imagem oficial. Checa se o postmaster
      # está aceitando conexão — diferente de só "o container está up".
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    shm_size: 256mb

  api:
    build: .
    container_name: docs-rag-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Sobrepõe o DATABASE_URL do .env (que aponta pra localhost:5433, pra
      # uso fora do compose) — dentro da rede interna o Postgres é acessível
      # pelo hostname do serviço, na porta padrão 5432.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    # Aplica migrations pendentes antes de subir o servidor. Simples e
    # suficiente pro estágio atual (single instance); em múltiplas réplicas
    # isso viraria um job separado pra evitar migrations concorrentes.
    # --frozen --no-sync: usa exatamente o ambiente já montado no build,
    # sem essa instalar o grupo dev (ruff, pytest) na imagem de produção.
    command: >
      sh -c "uv run --frozen --no-sync alembic upgrade head &&
             uv run --frozen --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data: