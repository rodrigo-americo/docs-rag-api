# docker-compose.yml
# Sem campo `version`: o Compose v2 usa o spec atual por default.
# Declarar `version` gera warning e é resquício do Compose v1.

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16-bookworm
    container_name: docs-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Expor no host permite conectar em localhost:5433 com um client externo
      # (psql, DBeaver) ou rodar a API fora do compose. O serviço `api` abaixo
      # não usa esta porta — ele fala com `postgres:5432` na rede interna.
      - "5433:5432"
    volumes:
      # Volume nomeado: sobrevive a `docker compose down`.
      # Pra wipe limpo: `docker compose down -v` (note o -v).
      - postgres_data:/var/lib/postgresql/data
      # Roda só na primeira inicialização (volume vazio) — cria
      # "${POSTGRES_DB}_test" pra suite de teste nunca truncar dados de dev
      # (ver tests/conftest.py e docs/testes.md).
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      # pg_isready vem no PATH da imagem oficial. Checa se o postmaster
      # está aceitando conexão — diferente de só "o container está up".
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    shm_size: 256mb

  redis:
    image: redis:7-alpine
    container_name: docs-rag-redis
    restart: unless-stopped
    ports:
      # Exposto no host só pra inspeção manual (redis-cli) durante o
      # desenvolvimento deste passo — api/worker falam com `redis:6379`
      # na rede interna do compose, não por esta porta.
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: docs-rag-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Sobrepõe o DATABASE_URL do .env (que aponta pra localhost:5433, pra
      # uso fora do compose) — dentro da rede interna o Postgres é acessível
      # pelo hostname do serviço, na porta padrão 5432.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      QUEUE_BACKEND: redis
      UPLOADS_DIR: /data/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Compartilhado com o worker: a API grava os bytes do upload aqui
      # (IngestService.ingest -> save_upload) e o worker lê pelo mesmo
      # document_id (IngestService.process_document -> read_upload). Sem
      # isso, os bytes não sobreviveriam entre dois processos diferentes.
      - uploads_data:/data/uploads
    # Aplica migrations pendentes antes de subir o servidor. Simples e
    # suficiente pro estágio atual (single instance); em múltiplas réplicas
    # isso viraria um job separado pra evitar migrations concorrentes.
    # --frozen --no-sync: usa exatamente o ambiente já montado no build,
    # sem essa instalar o grupo dev (ruff, pytest) na imagem de produção.
    command: >
      sh -c "uv run --frozen --no-sync alembic upgrade head &&
             uv run --frozen --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: .
    container_name: docs-rag-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      QUEUE_BACKEND: redis
      UPLOADS_DIR: /data/uploads
    ports:
      # ingest_processed_total e ingest_processing_seconds (ver app/core/metrics.py)
      # só incrementam dentro do processo do worker (process_document roda
      # aqui, não na API) — precisa da própria porta HTTP pra o Prometheus
      # fazer scrape (ver docker/prometheus/prometheus.yml). Exposta no host
      # só pra inspeção manual; prometheus fala com `worker:9100` na rede
      # interna do compose.
      - "9100:9100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/data/uploads
    # Sem alembic aqui: migrations já rodam no startup do serviço `api`.
    # Dois serviços rodando "alembic upgrade head" ao mesmo tempo na
    # inicialização é uma corrida desnecessária — só um precisa migrar.
    command: uv run --frozen --no-sync python -m app.worker

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: docs-rag-prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Nomeado: séries temporais sobrevivem a `docker compose down` (sem -v).
      - prometheus_data:/prometheus
    ports:
      # Exposto no host só pra inspecionar a UI/API do Prometheus direto
      # (ex: http://localhost:9090/graph) — grafana fala com `prometheus:9090`
      # na rede interna do compose, não por esta porta.
      - "9090:9090"
    depends_on:
      api:
        condition: service_started

  grafana:
    image: grafana/grafana:11.4.0
    container_name: docs-rag-grafana
    restart: unless-stopped
    environment:
      # Sem isso o Grafana pede pra trocar a senha admin/admin no primeiro
      # login — aceitável pra um dashboard interno de dev, não pra produção
      # exposta publicamente.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      # Datasource (Prometheus) e dashboard provisionados automaticamente —
      # ver docker/grafana/provisioning/. Evita configurar isso na UI toda
      # vez que o volume nomeado abaixo é recriado.
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  test:
    build:
      context: .
      target: test
    container_name: docs-rag-test
    env_file:
      - .env
    environment:
      # Ambos apontam pro mesmo Postgres do compose (rede interna), bancos
      # diferentes — docsrag_test é criado automaticamente por
      # docker/postgres-init/01-create-test-db.sh na primeira subida do
      # volume postgres_data. Ver docs/testes.md sobre por que
      # TEST_DATABASE_URL precisa ser diferente de DATABASE_URL.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}_test
      REDIS_URL: redis://redis:6379/0
      UPLOADS_DIR: /tmp/docs-rag-uploads-test
      EMBEDDING_PROVIDER: fake
      CHAT_PROVIDER: fake
      # 0 desliga start_http_server (app/worker.py) — tests/test_worker_integration.py
      # sobe múltiplas instâncias de run() no mesmo processo pytest; todas na
      # mesma porta fixa colidiriam ao tentar abrir o socket.
      WORKER_METRICS_PORT: "0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Roda em Linux (o mesmo SO do CI), não Windows — evita o flake de
    # ResourceWarning em sockets asyncio que o proactor do Windows produz
    # (ver docs/testes.md). Migrations em ambos os bancos antes da suite:
    # alembic/env.py sempre lê DATABASE_URL, então o banco de teste precisa
    # de uma segunda invocação sobrepondo a env var só para esse comando.
    # --profile test (não sobe com "docker compose up" normal): este
    # serviço roda a suite e termina, não é um servidor de vida longa.
    profiles: ["test"]
    command: >
      sh -c "uv run alembic upgrade head &&
             DATABASE_URL=$$TEST_DATABASE_URL uv run alembic upgrade head &&
             uv run pytest --ignore=tests/test_worker_integration.py --cov=app --cov-fail-under=0 &&
             QUEUE_BACKEND=redis uv run pytest tests/test_worker_integration.py -v --cov=app --cov-append --cov-report=term-missing"

volumes:
  postgres_data:
  uploads_data:
  prometheus_data:
  grafana_data: