# pyproject.toml
# Formato PEP 621 (standard). Toda a config do projeto vive aqui.

[project]
name = "docs-rag-api"
version = "0.1.0"
description = "API REST de RAG sobre PDF/Markdown com FastAPI, pgvector e LangGraph"
readme = "README.md"
requires-python = ">=3.13"
# Não declaro authors/license aqui — projeto de portfólio pessoal, não vai pro PyPI.
# Se decidir publicar depois, adiciono na hora.

dependencies = [
    # --- API ---
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",        # [standard] traz uvloop+httptools (mais rápido)
    "python-multipart>=0.0.20",            # FastAPI precisa disso pra UploadFile
    # --- Config e validação ---
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",         # Settings via .env
    # --- Banco ---
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",                  # Driver async pro Postgres
    "alembic>=1.14,<2.0",
    "pgvector>=0.3,<1.0",                  # Tipo VECTOR pro SQLAlchemy
    # --- LLM / RAG ---
    "langchain>=1.3,<2.0",
    "langchain-core>=1.3,<2.0",
    "langchain-openai>=1.1,<2.0",
    "langchain-text-splitters>=1.0,<2.0",  # RecursiveCharacterTextSplitter
    "langgraph>=1.0,<2.0",
    "langsmith>=0.4,<1.0",                 # Tracing — auto-detectado via env vars
    "openai>=2.0,<3.0",                    # usado direto em ingest.py pra capturar OpenAIError
    # --- Parsing ---
    "pypdf>=5.1,<6.0",
    "psycopg[binary]>=3.2,<4.0",
    "structlog>=24.4,<26.0",
    "numpy>=1.26,<3.0",                    # usado direto em FakeEmbeddingProvider
    "slowapi>=0.1.10",
    "bleach>=6.4.0",
    "redis>=5.0,<6.0",
    "prometheus-client>=0.21,<1.0",
]

[dependency-groups]
# Grupos de dev. `uv sync` instala todos por default.
# `uv sync --no-dev` pra imagem de produção.
dev = [
    "ruff>=0.8,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-recording>=0.13,<1.0",         # VCR — grava chamadas reais
    "httpx>=0.28,<1.0",                    # Cliente pros testes da API (FastAPI TestClient async)
    "vcrpy>=6.0,<7.0",                     # Dependência transitiva, mas pino pra controlar
    "pytest-cov>=7.1.0",
]

[build-system]
# Mesmo aplicação sem publicar, uv exige build-system pra resolver o projeto.
# hatchling é leve e é o que uv usa por default no `uv init`.
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --- pytest ---
[tool.pytest.ini_options]
asyncio_mode = "auto"                       # Auto-marca corotinas como async tests
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "error",                                # Warnings viram erros — pega deprecation cedo
    "ignore::DeprecationWarning:passlib.*", # Whitelist específica se precisar
    # NullPool (tests/conftest.py) + asyncpg + event loop novo por teste
    # (pytest-asyncio, function-scoped) deixa conexões TCP em processo de
    # fechamento no momento em que um teste termina e o próximo começa —
    # o GC as coleta de forma não-determinística, às vezes só no cleanup
    # final do próprio pytest, gerando ResourceWarning ali. Investigado a
    # fundo (não é um teste específico com bug: reproduzido isolando
    # arquivos, em Windows E em Linux/Docker) — é característica de fundo
    # dessa combinação de stack, não um recurso real vazando por descuido
    # de código. Sem esta exceção, filterwarnings=["error"] promove isso a
    # falha fatal intermitente e não-relacionada ao teste que "falha" (ver
    # docs/testes.md).
    "ignore::ResourceWarning",
]

# --- ruff ---
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/alembic/versions"]  # boilerplate gerado por template do Alembic

[tool.ruff.lint]
# Conjunto enxuto, sem virar inferno de regras.
# E: pycodestyle errors, F: pyflakes, I: isort, B: bugbear, UP: pyupgrade, SIM: simplify
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    "E501",  # line-length já controlado pelo formatter
    "B008",  # Depends()/File()/Form() em default é o padrão idiomático do FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]  # `assert False` é ok em testes

[tool.ruff.format]
# Default do ruff format (estilo black): aspas duplas, indent de 4 espaços,
# trailing commas normalizadas. Sem overrides — o default já é o que o
# projeto vinha tentando seguir manualmente.

# --- coverage ---
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# fail_under=80, não bloqueante no sentido de "caçar 100%": em repo de
# estudo, perseguir 100% literal vira jogo de pragma: no cover (ver o
# problema real que isso trouxe — funções que coverage.py nunca marca
# como cobertas mesmo executando de verdade, investigado em
# docs/testes.md) em vez de sinal de qualidade. 80% ainda falha o CI se
# cair — não é decorativo — só não persegue o último 20% a qualquer custo.
exclude_lines = [
    "pragma: no cover",
    # Entrypoint de processo — nunca executa sob pytest (importar o módulo
    # não dispara isso), só quando o arquivo roda como script.
    "if __name__ == .__main__.:",
    # assert de invariante interna (bug de programação, não caminho de
    # runtime alcançável por input externo) — ver app/services/ingest.py.
    "raise NotImplementedError",
    # Corpo de método dentro de um typing.Protocol (ex:
    # app/services/parsers/base.py, app/core/queue.py::QueueClient) —
    # assinatura de interface pra structural typing, nunca instanciado nem
    # chamado em runtime. Cobre tanto "..." numa linha própria quanto
    # "def foo(...): ..." numa linha só — restrito ao literal "..." pra
    # não mascarar um corpo real que por acaso contenha reticências.
    "^\\s*\\.\\.\\.\\s*$",
    "\\bdef .*: \\.\\.\\.$",
]
fail_under = 80
show_missing = true

[tool.coverage.html]
directory = "htmlcov"
